name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows you to trigger it manually from GitHub too

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install documentation dependencies
        run: |
          pip install "mkdocstrings>=1.0.7" mkdocstrings-python mkdocs-material mkdocs-include-markdown-plugin

      - name: Configure Git Identity for GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy documentation
        run: mkdocs gh-deploy --force